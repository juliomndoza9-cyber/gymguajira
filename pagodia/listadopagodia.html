/*
==========================================================
CONFIGURACIÓN DE PAGINACIÓN
==========================================================
*/

const registrosPorPagina = 5;

let paginaActual = 1;

let pagosFiltrados = [...pagos];



/*
==========================================================
FORMATO DE MONEDA
==========================================================
*/

function formatoMoneda(valor) {

    return "$" + valor.toLocaleString(
        "es-CO"
    );

}



/*
==========================================================
MOSTRAR PAGOS
==========================================================
*/

function mostrarPagos() {

    const tabla =
        document.getElementById(
            "tablaPagos"
        );


    tabla.innerHTML = "";


    const inicio =
        (paginaActual - 1)
        * registrosPorPagina;


    const fin =
        inicio + registrosPorPagina;


    const registros =
        pagosFiltrados.slice(
            inicio,
            fin
        );


    /*
    ==========================================
    SIN RESULTADOS
    ==========================================
    */

    if (registros.length === 0) {

        tabla.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="text-center"
                >

                    No hay pagos registrados.

                </td>

            </tr>

        `;

        actualizarResumen();

        mostrarPaginacion();

        return;

    }


    /*
    ==========================================
    CREAR FILAS
    ==========================================
    */

    registros.forEach(function(pago) {

        const fila =
            document.createElement("tr");


        fila.innerHTML = `

            <td>
                ${pago.id}
            </td>

            <td>
                ${pago.identificacion}
            </td>

            <td>
                ${pago.nombres}
                ${pago.apellidos}
            </td>

            <td>
                ${pago.telefono}
            </td>

            <td>
                ${pago.fecha}
            </td>

            <td>

                <strong>
                    ${formatoMoneda(pago.valor)}
                </strong>

            </td>

        `;


        tabla.appendChild(fila);

    });


    actualizarResumen();

    mostrarPaginacion();

}



/*
==========================================================
ACTUALIZAR RESUMEN
==========================================================
*/

function actualizarResumen() {

    const cantidad =
        pagosFiltrados.length;


    const total =
        pagosFiltrados.reduce(
            function(acumulado, pago) {

                return acumulado + pago.valor;

            },
            0
        );


    document.getElementById(
        "cantidadPagos"
    ).textContent = cantidad;


    document.getElementById(
        "totalAcumulado"
    ).textContent =
        formatoMoneda(total);

}



/*
==========================================================
PAGINACIÓN
==========================================================
*/

function mostrarPaginacion() {

    const contenedor =
        document.getElementById(
            "paginacion"
        );


    contenedor.innerHTML = "";


    const totalPaginas =
        Math.ceil(
            pagosFiltrados.length
            / registrosPorPagina
        );


    if (totalPaginas <= 1) {

        return;

    }


    /*
    ==========================================
    BOTÓN ANTERIOR
    ==========================================
    */

    const anterior =
        document.createElement("li");


    anterior.className =
        "page-item";


    if (paginaActual === 1) {

        anterior.classList.add(
            "disabled"
        );

    }


    anterior.innerHTML = `

        <button
            class="page-link"
            type="button"
            onclick="cambiarPagina(${paginaActual - 1})"
        >

            Anterior

        </button>

    `;


    contenedor.appendChild(anterior);



    /*
    ==========================================
    NÚMEROS DE PÁGINA
    ==========================================
    */

    for (
        let pagina = 1;
        pagina <= totalPaginas;
        pagina++
    ) {

        const elemento =
            document.createElement("li");


        elemento.className =
            "page-item";


        if (
            pagina === paginaActual
        ) {

            elemento.classList.add(
                "active"
            );

        }


        elemento.innerHTML = `

            <button
                class="page-link"
                type="button"
                onclick="cambiarPagina(${pagina})"
            >

                ${pagina}

            </button>

        `;


        contenedor.appendChild(
            elemento
        );

    }



    /*
    ==========================================
    BOTÓN SIGUIENTE
    ==========================================
    */

    const siguiente =
        document.createElement("li");


    siguiente.className =
        "page-item";


    if (
        paginaActual === totalPaginas
    ) {

        siguiente.classList.add(
            "disabled"
        );

    }


    siguiente.innerHTML = `

        <button
            class="page-link"
            type="button"
            onclick="cambiarPagina(${paginaActual + 1})"
        >

            Siguiente

        </button>

    `;


    contenedor.appendChild(
        siguiente
    );

}



/*
==========================================================
CAMBIAR PÁGINA
==========================================================
*/

function cambiarPagina(pagina) {

    const totalPaginas =
        Math.ceil(
            pagosFiltrados.length
            / registrosPorPagina
        );


    if (
        pagina < 1 ||
        pagina > totalPaginas
    ) {

        return;

    }


    paginaActual = pagina;

    mostrarPagos();

}



/*
==========================================================
BUSCAR PAGOS
==========================================================
*/

function buscarPagos() {

    const texto =
        document.getElementById(
            "buscarPago"
        ).value
        .toLowerCase()
        .trim();


    pagosFiltrados =
        pagos.filter(function(pago) {

            const documento =
                pago.identificacion
                .toLowerCase();


            const nombre =
                (
                    pago.nombres
                    + " "
                    + pago.apellidos
                )
                .toLowerCase();


            return (
                documento.includes(texto)
                ||
                nombre.includes(texto)
            );

        });


    paginaActual = 1;

    mostrarPagos();

}



/*
==========================================================
BUSCAR AUTOMÁTICAMENTE AL ESCRIBIR
==========================================================
*/

document
    .getElementById("buscarPago")
    .addEventListener(
        "input",
        buscarPagos
    );



/*
==========================================================
REGISTRAR PAGO
==========================================================
*/

}
